<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MJ 扩展手工测试页</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 24px; font: 16px/1.6 system-ui; }
      label { display: grid; gap: 6px; margin: 24px 0; }
      input, textarea, [contenteditable] { padding: 12px; border: 1px solid #aaa; border-radius: 8px; }
      [contenteditable] { min-height: 70px; }
    </style>
  </head>
  <body>
    <h1>MJ 扩展手工测试页</h1>
    <p>请依次在三个可编辑区域中输入 mj、MJ、Mj、mJ，并确认输入保留、动画与声音各播放一次。</p>
    <label>搜索框 <input type="search" placeholder="输入 mj" /></label>
    <label>文本域 <textarea placeholder="输入 mj"></textarea></label>
    <label>可编辑区域 <span contenteditable="true">在这里输入：</span></label>
    <label>密码框（不得触发） <input type="password" /></label>
  </body>
</html>
